spring.application.name=one23

# Load local .env file if present (for easy local dev)
spring.config.import=optional:file:.env[.properties]

# Read sensitive DB config from project-specific env vars
spring.datasource.url=${ONE23_DATABASE_URL}
spring.datasource.username=${ONE23_DATABASE_USERNAME}
spring.datasource.password=${ONE23_DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true