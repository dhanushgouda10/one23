# Production overrides, activated with SPRING_PROFILES_ACTIVE=prod.
# Everything not overridden here still comes from application.properties
# (env-var driven already — DB, JWT, CORS, mail, rate limiting).

# ---- JPA / Hibernate ----
# show-sql prints every query to stdout — fine for local dev, noisy and
# a minor info-leak risk in prod logs. Schema is validated, not created,
# here too (same as base config) since Flyway owns migrations.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate



# ---- Error responses ----
# Belt-and-suspenders alongside GlobalExceptionHandler: never let a
# framework-level error response (one GlobalExceptionHandler didn't
# catch) include a stack trace or raw exception message.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---- Logging ----
# Quiet, structured-enough defaults for production. Raise com.one23 to
# DEBUG temporarily if you need to trace a specific issue.
logging.level.root=INFO
logging.level.com.one23=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
