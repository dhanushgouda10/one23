spring.application.name=one23
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Most PaaS platforms (Render, Railway, Heroku, etc.) inject the port to
# bind to via $PORT — fall back to 8080 for local dev / anywhere that
# doesn't set it.
server.port=${PORT:8080}



spring.datasource.url=${ONE23_DATABASE_URL}
spring.datasource.username=${ONE23_DATABASE_USERNAME}
spring.datasource.password=${ONE23_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is now owned by Flyway (see db/migration/) instead of Hibernate
# auto-DDL. "validate" makes Hibernate check the entities against the
# actual schema at startup and fail fast on drift, but never mutate the
# database itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== Flyway ====================
# baseline-on-migrate lets Flyway adopt a database that already has this
# schema (created previously via ddl-auto=update) without trying to
# re-run V1 against it — V1 is recorded as already applied, and only
# migrations after baseline-version actually execute. A genuinely fresh
# database (new local/dev DB, CI, etc.) runs every migration from V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline of schema created via ddl-auto=update prior to Flyway adoption

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================== Login rate limiting ====================
# Applies to POST /api/auth/login, keyed separately by client IP and by
# submitted email (see LoginRateLimiter) — protects against brute-force
# and credential-stuffing attempts.
app.security.login-rate-limit.max-attempts=${ONE23_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-seconds=${ONE23_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# ==================== CORS ====================
# Comma-separated list of frontend origins allowed to call this API and
# connect to the WebSocket endpoint. Defaults to the local Vite dev ports
# so local development needs no extra setup; override with your real
# frontend domain(s) in production via ONE23_CORS_ALLOWED_ORIGINS
# (e.g. https://one23.app,https://www.one23.app).
app.cors.allowed-origins=${ONE23_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:3000}

# ==================== Email (Welcome Email) ====================
# Sends a "Welcome to One23" email after signup using Gmail SMTP by default.
# All values below have safe fallback defaults, so the app still starts
# even if these env vars aren't set yet — sending will just fail quietly
# (see EmailService) until you configure real credentials below.
#
# To switch to a different SMTP provider later (Outlook, Mailtrap,
# SendGrid, etc.) you only need to change these properties/env vars —
# no Java code needs to change.
spring.mail.host=${ONE23_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ONE23_MAIL_PORT:587}
spring.mail.username=${ONE23_MAIL_USERNAME:}
spring.mail.password=${ONE23_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# "From" address on the welcome email — for Gmail SMTP this must be the
# same address as spring.mail.username.
app.mail.from=${ONE23_MAIL_USERNAME:noreply@one23.app}

# Where the "Login Now" button in the welcome email points to
app.frontend.login-url=${ONE23_FRONTEND_LOGIN_URL:http://localhost:5173/login}
